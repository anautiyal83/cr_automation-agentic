[project]
name = "cr-automation-agentic"
version = "0.1.0"
description = "Agentic framework for telecom UC automation using Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.3.0",
    "litellm>=1.40.0",
    "nicegui>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "ruamel.yaml>=0.18.0",
    "Jinja2>=3.1.0",
    "xlsxwriter>=3.2.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.5.0",
    "aiosqlite>=0.20.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
