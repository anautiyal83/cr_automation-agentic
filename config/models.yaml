# Per-step LLM model assignments
# Steps 1-4, 6-7 use LLM agents; null means use default model
# Steps 5, 8-9 are deterministic (no LLM)

default_model: "openrouter/google/gemini-2.5-flash"

steps:
  1:
    name: "Document Parser"
    model: null
    uses_llm: true
  2:
    name: "UC Analyzer"
    model: null
    uses_llm: true
  3:
    name: "Validation Rules Generator"
    model: null
    uses_llm: true
  4:
    name: "JSON Output Generator"
    model: null
    uses_llm: true
  5:
    name: "CIQ Validation Tester"
    model: null
    uses_llm: false
  6:
    name: "Workflow Generator"
    model: null
    uses_llm: true
  7:
    name: "Simulator Config Generator"
    model: null
    uses_llm: true
  8:
    name: "Execution Tester"
    model: null
    uses_llm: false
  9:
    name: "Final Report Generator"
    model: null
    uses_llm: false
